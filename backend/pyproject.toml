[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "databy-ai-backend"
version = "0.1.0"
description = "Backend API for databy.ai"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=50.0.0,<51",
    "fastapi>=0.115,<1",
    "PyJWT>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "email-validator>=2.1,<3",
    "langchain>=0.3,<2",
    "langchain-groq>=0.3,<2",
    "langgraph>=0.2,<2",
    "python-multipart>=0.0.12,<1",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=26,<30",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.0.3,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
